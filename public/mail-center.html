<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mejlcentralen v7</title>

  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --card: #f7f7f8;
      --border: #dddddf;
      --text: #171717;
      --muted: #6b6b6b;
      --green: #16803a;
      --green-soft: #e9f7ee;
      --yellow: #9a6700;
      --yellow-soft: #fff5cc;
      --red: #b42318;
      --red-soft: #feeceb;
      --button-disabled: #e5e5e7;
      --button-disabled-text: #8a8a8a;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #181818;
        --card: #242424;
        --border: #3a3a3a;
        --text: #f5f5f5;
        --muted: #a9a9a9;
        --green-soft: #173b24;
        --yellow-soft: #40340d;
        --red-soft: #421d1b;
        --button-disabled: #303030;
        --button-disabled-text: #777777;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
    }

    .app {
      max-width: 820px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 22px;
    }

    h2 {
      margin: 24px 0 8px;
      font-size: 17px;
    }

    .intro,
    .section-info,
    .hint,
    .empty {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .card {
      margin-top: 10px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card);
    }

    .title {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.35;
    }

    .meta {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .summary {
      margin-top: 8px;
      font-size: 13px;
      line-height: 1.45;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 12px;
    }

    button {
      appearance: none;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--bg);
      color: var(--text);
      padding: 8px 11px;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    button.selected {
      border-color: var(--green);
      background: var(--green-soft);
      color: var(--green);
    }

    button.skip.selected {
      border-color: var(--yellow);
      background: var(--yellow-soft);
      color: var(--yellow);
    }

    button.delete.selected {
      border-color: var(--red);
      background: var(--red-soft);
      color: var(--red);
    }

    button.keep.selected {
      border-color: var(--green);
      background: var(--green-soft);
      color: var(--green);
    }

    .reply-box,
    .reminder-box {
      display: none;
      margin-top: 12px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
    }

    .reply-box.visible,
    .reminder-box.visible {
      display: block;
    }

    textarea {
      width: 100%;
      min-height: 130px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      background: var(--bg);
      color: var(--text);
      font: inherit;
      font-size: 13px;
      line-height: 1.45;
    }

    .reply-actions {
      margin-top: 8px;
    }

    .approve.selected {
      border-color: var(--green);
      background: var(--green-soft);
      color: var(--green);
    }

    .reminder-title {
      margin-bottom: 10px;
      font-size: 13px;
      font-weight: 700;
    }

    .reminder-fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .field label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    input[type="date"],
    input[type="time"] {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      background: var(--bg);
      color: var(--text);
      font: inherit;
      font-size: 14px;
    }

    .reminder-error {
      display: none;
      margin-top: 8px;
      color: var(--red);
      font-size: 12px;
    }

    .reminder-error.visible {
      display: block;
    }

    .footer {
      position: sticky;
      bottom: 0;
      margin-top: 18px;
      padding: 12px 0 4px;
      background: var(--bg);
    }

    .progress {
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .submit {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--border);
      background: var(--button-disabled);
      color: var(--button-disabled-text);
      font-size: 14px;
      cursor: not-allowed;
      transition:
        background 0.15s ease,
        border-color 0.15s ease,
        color 0.15s ease,
        opacity 0.15s ease;
    }

    .submit.ready {
      border-color: var(--green);
      background: var(--green);
      color: #ffffff;
      cursor: pointer;
    }

    .submit.sending {
      border-color: var(--green);
      background: var(--green);
      color: #ffffff;
      cursor: wait;
      opacity: 0.72;
    }

    .submit.sent {
      border-color: var(--green);
      background: var(--green-soft);
      color: var(--green);
      cursor: default;
    }

    .submit:disabled {
      cursor: not-allowed;
    }

    @media (max-width: 560px) {
      body {
        padding: 12px;
      }

      .reminder-fields {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <h1>Mejlcentralen v7</h1>

    <div class="intro">
      Välj vad som ska göras med varje mejl. Inget utförs förrän du
      klickar på <strong>Utför åtgärder</strong>.
    </div>

    <section>
      <h2>Mejl att hantera</h2>
      <div id="task-list"></div>
    </section>

    <section>
      <h2>Reklam / utskick</h2>

      <div class="section-info">
        Jag bedömer att dessa är reklam eller andra utskick.
        Välj <strong>Radera</strong> eller
        <strong>Behåll</strong> för varje mejl.
      </div>

      <div id="ad-list"></div>
    </section>

    <div class="footer">
      <div id="progress" class="progress"></div>

      <button
        id="submit"
        class="submit"
        type="button"
        disabled
      >
        Utför åtgärder
      </button>

      <div
        class="hint"
        style="margin-top:8px;text-align:center;"
      >
        Alla visade mejl måste ha ett färdigt val.
      </div>
    </div>
  </main>

  <script>
    const APP_VERSION = "0.7.1";

    const STATUS_CONFIG = {
      reply: { label: "Svara" },
      done: { label: "Klar" },
      wait: { label: "Vänta" },
      watch: { label: "Bevaka" },
      remind: { label: "Påminn" },
      skip: {
        label: "Ingen åtgärd",
        className: "skip"
      }
    };

    const STATUS_ORDER = [
      "reply",
      "done",
      "wait",
      "watch",
      "remind",
      "skip"
    ];

    const AD_STATUS_CONFIG = {
      delete: {
        label: "Radera",
        className: "delete"
      },

      keep: {
        label: "Behåll",
        className: "keep"
      }
    };

    let tasks = [];
    let ads = [];

    const decisions = {};
    const adDecisions = {};

    let submitState = "idle";

    function markChanged() {
      if (
        submitState === "sent" ||
        submitState === "sending"
      ) {
        submitState = "idle";
      }
    }

    function normalizeTasks(input) {
      if (!Array.isArray(input)) {
        return [];
      }

      return input.map((task, index) => ({
        id: String(
          task?.id ??
          `task-${index + 1}`
        ),

        title: String(
          task?.title ??
          "Mejl"
        ),

        account: String(
          task?.account ?? ""
        ),

        received: String(
          task?.received ?? ""
        ),

        summary: String(
          task?.summary ?? ""
        ),

        statuses:
          Array.isArray(task?.statuses) &&
          task.statuses.length
            ? task.statuses.filter(
                status =>
                  STATUS_CONFIG[status]
              )
            : [...STATUS_ORDER],

        replyDraft:
          typeof task?.replyDraft ===
          "string"
            ? task.replyDraft
            : "",

        done: Boolean(task?.done)
      }));
    }

    function normalizeAds(input) {
      if (!Array.isArray(input)) {
        return [];
      }

      return input.map(
        (ad, index) => ({
          id: String(
            ad?.id ??
            `ad-${index + 1}`
          ),

          title: String(
            ad?.title ??
            "Utskick"
          ),

          sender: String(
            ad?.sender ?? ""
          ),

          account: String(
            ad?.account ?? ""
          ),

          received: String(
            ad?.received ?? ""
          ),

          summary: String(
            ad?.summary ?? ""
          ),

          statuses: [
            "delete",
            "keep"
          ]
        })
      );
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function buildMeta(parts) {
      return parts
        .filter(Boolean)
        .join(" · ");
    }

    function setDecision(
      task,
      status
    ) {
      markChanged();

      const previous =
        decisions[task.id] || {};

      if (status === "reply") {
        decisions[task.id] = {
          status: "reply",

          text:
            previous.status ===
              "reply" &&
            typeof previous.text ===
              "string"
              ? previous.text
              : task.replyDraft || "",

          approved: false
        };
      }

      else if (
        status === "remind"
      ) {
        decisions[task.id] = {
          status: "remind",

          date:
            previous.status ===
              "remind"
              ? previous.date || ""
              : "",

          time:
            previous.status ===
              "remind"
              ? previous.time || ""
              : ""
        };
      }

      else {
        decisions[task.id] = {
          status
        };
      }

      render();
    }

    function setAdDecision(
      ad,
      status
    ) {
      markChanged();

      adDecisions[ad.id] = {
        status
      };

      render();
    }

    function updateReplyText(
      taskId,
      text
    ) {
      const decision =
        decisions[taskId];

      if (
        !decision ||
        decision.status !== "reply"
      ) {
        return;
      }

      markChanged();

      decision.text = text;
      decision.approved = false;

      updateProgress();
    }

    function approveReply(
      taskId
    ) {
      const decision =
        decisions[taskId];

      if (
        !decision ||
        decision.status !== "reply"
      ) {
        return;
      }

      markChanged();

      decision.approved = true;

      render();
    }

    function updateReminder(
      taskId,
      field,
      value
    ) {
      const decision =
        decisions[taskId];

      if (
        !decision ||
        decision.status !== "remind"
      ) {
        return;
      }

      markChanged();

      decision[field] = value;

      updateProgress();
      updateReminderError(
        taskId
      );
    }

    function reminderComplete(
      taskId
    ) {
      const decision =
        decisions[taskId];

      return Boolean(
        decision &&
        decision.status ===
          "remind" &&
        decision.date &&
        decision.time
      );
    }

    function taskDecisionComplete(
      task
    ) {
      const decision =
        decisions[task.id];

      if (!decision) {
        return false;
      }

      if (
        decision.status === "reply"
      ) {
        return Boolean(
          decision.approved &&
          typeof decision.text ===
            "string" &&
          decision.text.trim()
        );
      }

      if (
        decision.status ===
        "remind"
      ) {
        return reminderComplete(
          task.id
        );
      }

      return true;
    }

    function adDecisionComplete(
      ad
    ) {
      const decision =
        adDecisions[ad.id];

      return Boolean(
        decision &&
        (
          decision.status ===
            "delete" ||
          decision.status ===
            "keep"
        )
      );
    }

    function allComplete() {
      const total =
        tasks.length +
        ads.length;

      if (total === 0) {
        return false;
      }

      return (
        tasks.every(
          taskDecisionComplete
        ) &&
        ads.every(
          adDecisionComplete
        )
      );
    }

    function updateSubmitButton() {
      const submit =
        document.getElementById(
          "submit"
        );

      submit.classList.remove(
        "ready",
        "sending",
        "sent"
      );

      if (
        submitState === "sending"
      ) {
        submit.disabled = true;
        submit.classList.add(
          "sending"
        );
        submit.textContent =
          "Utför åtgärder…";
        return;
      }

      if (
        submitState === "sent"
      ) {
        submit.disabled = true;
        submit.classList.add(
          "sent"
        );
        submit.textContent =
          "✓ Åtgärder skickade";
        return;
      }

      if (allComplete()) {
        submit.disabled = false;
        submit.classList.add(
          "ready"
        );
        submit.textContent =
          "Utför åtgärder";
        return;
      }

      submit.disabled = true;
      submit.textContent =
        "Utför åtgärder";
    }

    function updateProgress() {
      const total =
        tasks.length +
        ads.length;

      const completedTasks =
        tasks.filter(
          taskDecisionComplete
        ).length;

      const completedAds =
        ads.filter(
          adDecisionComplete
        ).length;

      const completed =
        completedTasks +
        completedAds;

      const progress =
        document.getElementById(
          "progress"
        );

      if (total === 0) {
        progress.textContent =
          "Inga mejl att hantera.";

        updateSubmitButton();
        return;
      }

      if (
        submitState === "sent"
      ) {
        progress.textContent =
          `${total} av ${total} mejl skickade för åtgärd`;

        updateSubmitButton();
        return;
      }

      progress.textContent =
        `${completed} av ${total} mejl klara`;

      updateSubmitButton();
    }

    function updateReminderError(
      taskId
    ) {
      const error =
        document.getElementById(
          `reminder-error-${taskId}`
        );

      if (!error) {
        return;
      }

      const decision =
        decisions[taskId];

      if (
        decision?.date &&
        decision?.time
      ) {
        error.classList.remove(
          "visible"
        );
      } else {
        error.classList.add(
          "visible"
        );
      }
    }

    function createStatusButton(
      task,
      status
    ) {
      const config =
        STATUS_CONFIG[status];

      const decision =
        decisions[task.id];

      const button =
        document.createElement(
          "button"
        );

      button.type = "button";
      button.textContent =
        config.label;

      if (config.className) {
        button.classList.add(
          config.className
        );
      }

      if (
        decision?.status ===
        status
      ) {
        button.classList.add(
          "selected"
        );
      }

      button.addEventListener(
        "click",
        () => {
          setDecision(
            task,
            status
          );
        }
      );

      return button;
    }

    function createTaskCard(task) {
      const card =
        document.createElement(
          "article"
        );

      card.className = "card";

      const meta =
        buildMeta([
          task.account,
          task.received
        ]);

      card.innerHTML = `
        <div class="title">
          ${escapeHtml(task.title)}
        </div>

        ${
          meta
            ? `<div class="meta">
                ${escapeHtml(meta)}
               </div>`
            : ""
        }

        ${
          task.summary
            ? `<div class="summary">
                ${escapeHtml(
                  task.summary
                )}
               </div>`
            : ""
        }
      `;

      const buttons =
        document.createElement(
          "div"
        );

      buttons.className =
        "buttons";

      STATUS_ORDER
        .filter(
          status =>
            task.statuses.includes(
              status
            )
        )
        .forEach(status => {
          buttons.appendChild(
            createStatusButton(
              task,
              status
            )
          );
        });

      card.appendChild(
        buttons
      );

      const decision =
        decisions[task.id];

      if (
        decision?.status ===
        "reply"
      ) {
        const replyBox =
          document.createElement(
            "div"
          );

        replyBox.className =
          "reply-box visible";

        const textarea =
          document.createElement(
            "textarea"
          );

        textarea.value =
          decision.text || "";

        textarea.addEventListener(
          "input",
          event => {
            updateReplyText(
              task.id,
              event.target.value
            );
          }
        );

        const actions =
          document.createElement(
            "div"
          );

        actions.className =
          "reply-actions";

        const approve =
          document.createElement(
            "button"
          );

        approve.type = "button";
        approve.className =
          "approve";

        approve.textContent =
          decision.approved
            ? "Svar godkänt"
            : "Godkänn svar";

        if (
          decision.approved
        ) {
          approve.classList.add(
            "selected"
          );
        }

        approve.addEventListener(
          "click",
          () => {
            approveReply(
              task.id
            );
          }
        );

        actions.appendChild(
          approve
        );

        replyBox.appendChild(
          textarea
        );

        replyBox.appendChild(
          actions
        );

        card.appendChild(
          replyBox
        );
      }

      if (
        decision?.status ===
        "remind"
      ) {
        const reminderBox =
          document.createElement(
            "div"
          );

        reminderBox.className =
          "reminder-box visible";

        const reminderTitle =
          document.createElement(
            "div"
          );

        reminderTitle.className =
          "reminder-title";

        reminderTitle.textContent =
          "När vill du bli påmind?";

        reminderBox.appendChild(
          reminderTitle
        );

        const fields =
          document.createElement(
            "div"
          );

        fields.className =
          "reminder-fields";

        const dateField =
          document.createElement(
            "div"
          );

        dateField.className =
          "field";

        const dateLabel =
          document.createElement(
            "label"
          );

        dateLabel.textContent =
          "Datum";

        const dateInput =
          document.createElement(
            "input"
          );

        dateInput.type = "date";
        dateInput.value =
          decision.date || "";

        dateInput.addEventListener(
          "change",
          event => {
            updateReminder(
              task.id,
              "date",
              event.target.value
            );
          }
        );

        dateField.appendChild(
          dateLabel
        );

        dateField.appendChild(
          dateInput
        );

        const timeField =
          document.createElement(
            "div"
          );

        timeField.className =
          "field";

        const timeLabel =
          document.createElement(
            "label"
          );

        timeLabel.textContent =
          "Tid";

        const timeInput =
          document.createElement(
            "input"
          );

        timeInput.type = "time";
        timeInput.value =
          decision.time || "";

        timeInput.addEventListener(
          "change",
          event => {
            updateReminder(
              task.id,
              "time",
              event.target.value
            );
          }
        );

        timeField.appendChild(
          timeLabel
        );

        timeField.appendChild(
          timeInput
        );

        fields.appendChild(
          dateField
        );

        fields.appendChild(
          timeField
        );

        reminderBox.appendChild(
          fields
        );

        const error =
          document.createElement(
            "div"
          );

        error.id =
          `reminder-error-${task.id}`;

        error.className =
          "reminder-error visible";

        error.textContent =
          "Välj både datum och tid.";

        reminderBox.appendChild(
          error
        );

        card.appendChild(
          reminderBox
        );
      }

      return card;
    }

    function createAdButton(
      ad,
      status
    ) {
      const config =
        AD_STATUS_CONFIG[
          status
        ];

      const decision =
        adDecisions[ad.id];

      const button =
        document.createElement(
          "button"
        );

      button.type = "button";
      button.textContent =
        config.label;

      button.classList.add(
        config.className
      );

      if (
        decision?.status ===
        status
      ) {
        button.classList.add(
          "selected"
        );
      }

      button.addEventListener(
        "click",
        () => {
          setAdDecision(
            ad,
            status
          );
        }
      );

      return button;
    }

    function createAdCard(ad) {
      const card =
        document.createElement(
          "article"
        );

      card.className = "card";

      const meta =
        buildMeta([
          ad.sender,
          ad.account,
          ad.received
        ]);

      card.innerHTML = `
        <div class="title">
          ${escapeHtml(ad.title)}
        </div>

        ${
          meta
            ? `<div class="meta">
                ${escapeHtml(meta)}
               </div>`
            : ""
        }

        ${
          ad.summary
            ? `<div class="summary">
                ${escapeHtml(
                  ad.summary
                )}
               </div>`
            : ""
        }
      `;

      const buttons =
        document.createElement(
          "div"
        );

      buttons.className =
        "buttons";

      buttons.appendChild(
        createAdButton(
          ad,
          "delete"
        )
      );

      buttons.appendChild(
        createAdButton(
          ad,
          "keep"
        )
      );

      card.appendChild(
        buttons
      );

      return card;
    }

    function render() {
      const taskList =
        document.getElementById(
          "task-list"
        );

      const adList =
        document.getElementById(
          "ad-list"
        );

      taskList.innerHTML = "";
      adList.innerHTML = "";

      if (
        tasks.length === 0
      ) {
        const empty =
          document.createElement(
            "div"
          );

        empty.className =
          "empty";

        empty.style.marginTop =
          "10px";

        empty.textContent =
          "Inga relevanta mejl just nu.";

        taskList.appendChild(
          empty
        );
      } else {
        tasks.forEach(task => {
          taskList.appendChild(
            createTaskCard(task)
          );
        });
      }

      if (
        ads.length === 0
      ) {
        const empty =
          document.createElement(
            "div"
          );

        empty.className =
          "empty";

        empty.style.marginTop =
          "10px";

        empty.textContent =
          "Ingen identifierad reklam just nu.";

        adList.appendChild(
          empty
        );
      } else {
        ads.forEach(ad => {
          adList.appendChild(
            createAdCard(ad)
          );
        });
      }

      updateProgress();

      tasks.forEach(task => {
        if (
          decisions[task.id]
            ?.status ===
          "remind"
        ) {
          updateReminderError(
            task.id
          );
        }
      });
    }

    function buildBatch() {
      const actions = [];
      const skipped = [];
      const adActions = [];

      tasks.forEach(task => {
        const decision =
          decisions[task.id];

        if (!decision) {
          return;
        }

        if (
          decision.status ===
          "skip"
        ) {
          skipped.push({
            id: task.id,
            title: task.title,
            account:
              task.account
          });

          return;
        }

        const action = {
          id: task.id,
          title: task.title,
          account:
            task.account,
          status:
            decision.status
        };

        if (
          decision.status ===
          "reply"
        ) {
          action.text =
            decision.text;

          action.approved =
            true;
        }

        if (
          decision.status ===
          "remind"
        ) {
          action.reminder = {
            date:
              decision.date,
            time:
              decision.time
          };
        }

        actions.push(
          action
        );
      });

      ads.forEach(ad => {
        const decision =
          adDecisions[ad.id];

        if (!decision) {
          return;
        }

        adActions.push({
          id: ad.id,
          title: ad.title,
          sender: ad.sender,
          account: ad.account,
          status:
            decision.status
        });
      });

      return {
        source:
          "Mejlcentralen",

        type: "batch",

        version: 7,

        appVersion:
          APP_VERSION,

        actions,
        skipped,
        adActions
      };
    }

    async function sendBatch() {
      if (
        !allComplete() ||
        submitState === "sending" ||
        submitState === "sent"
      ) {
        tasks.forEach(task => {
          if (
            decisions[task.id]
              ?.status ===
            "remind"
          ) {
            updateReminderError(
              task.id
            );
          }
        });

        return;
      }

      submitState = "sending";
      updateProgress();

      const batch =
        buildBatch();

      const message =
        "MEJLCENTRAL_BATCH " +
        JSON.stringify(batch);

      let sent = false;

      try {
        if (
          window.openai &&
          typeof window.openai
            .sendFollowUpMessage ===
            "function"
        ) {
          await window.openai
            .sendFollowUpMessage({
              prompt: message
            });

          sent = true;
        }
      } catch (error) {
        console.error(
          "sendFollowUpMessage failed:",
          error
        );
      }

      if (!sent) {
        try {
          window.parent.postMessage(
            {
              type:
                "openai:send_follow_up_message",

              prompt: message
            },
            "*"
          );

          sent = true;
        } catch (error) {
          console.error(
            "Fallback postMessage failed:",
            error
          );
        }
      }

      if (sent) {
        submitState = "sent";
      } else {
        submitState = "idle";
      }

      updateProgress();
    }

    function extractToolOutput(
      value
    ) {
      if (
        !value ||
        typeof value !== "object"
      ) {
        return {
          tasks: [],
          ads: []
        };
      }

      if (
        Array.isArray(
          value.tasks
        ) ||
        Array.isArray(
          value.ads
        )
      ) {
        return {
          tasks:
            Array.isArray(
              value.tasks
            )
              ? value.tasks
              : [],

          ads:
            Array.isArray(
              value.ads
            )
              ? value.ads
              : []
        };
      }

      if (
        value.structuredContent &&
        typeof value
          .structuredContent ===
          "object"
      ) {
        return {
          tasks:
            Array.isArray(
              value
                .structuredContent
                .tasks
            )
              ? value
                  .structuredContent
                  .tasks
              : [],

          ads:
            Array.isArray(
              value
                .structuredContent
                .ads
            )
              ? value
                  .structuredContent
                  .ads
              : []
        };
      }

      return {
        tasks: [],
        ads: []
      };
    }

    function applyOutput(value) {
      const output =
        extractToolOutput(
          value
        );

      tasks =
        normalizeTasks(
          output.tasks
        );

      ads =
        normalizeAds(
          output.ads
        );

      submitState = "idle";

      Object.keys(
        decisions
      ).forEach(key => {
        delete decisions[key];
      });

      Object.keys(
        adDecisions
      ).forEach(key => {
        delete adDecisions[key];
      });

      tasks.forEach(task => {
        if (task.done) {
          decisions[
            task.id
          ] = {
            status: "done"
          };
        }
      });

      render();
    }

    document
      .getElementById(
        "submit"
      )
      .addEventListener(
        "click",
        sendBatch
      );

    window.addEventListener(
      "openai:set_globals",
      event => {
        const globals =
          event?.detail
            ?.globals;

        if (!globals) {
          return;
        }

        if (
          globals.toolOutput
        ) {
          applyOutput(
            globals.toolOutput
          );

          return;
        }

        if (
          globals.tool_output
        ) {
          applyOutput(
            globals.tool_output
          );
        }
      }
    );

    if (
      window.openai
        ?.toolOutput
    ) {
      applyOutput(
        window.openai
          .toolOutput
      );
    }

    else if (
      window.openai
        ?.tool_output
    ) {
      applyOutput(
        window.openai
          .tool_output
      );
    }

    else {
      render();
    }
  </script>
</body>
</html>
