<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mejlcentralen v3</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171717;background:transparent}
*{box-sizing:border-box}body{margin:0;padding:12px;background:transparent}.shell{max-width:820px;margin:auto;display:grid;gap:12px}
.head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.head h1{font-size:20px;margin:0}.sub,.meta,.help,.status{font-size:12px;color:#666}
.counter{border:1px solid #ddd;border-radius:999px;padding:6px 10px;font-size:12px;white-space:nowrap;background:#fff}
.card{border:1px solid #e3e3e3;border-radius:16px;padding:14px;background:#fff}.card.decided{border-color:#9fd2ae;background:#fbfffc}
.title{font-weight:750;font-size:15px}.summary{font-size:13px;line-height:1.45;margin:10px 0 12px}
.actions,.row{display:flex;flex-wrap:wrap;gap:7px}.btn{border:1px solid #d5d5d5;border-radius:10px;padding:8px 11px;background:#fff;color:#222;font-size:13px;font-weight:650;cursor:pointer}
.btn:hover{background:#f6f6f6}.btn.selected{background:#16803c;color:#fff;border-color:#16803c}.btn.skip{color:#666}
.editor{display:none;margin-top:10px;padding-top:10px;border-top:1px solid #eee}.editor.show{display:block}
textarea,input{width:100%;border:1px solid #d8d8d8;border-radius:10px;padding:9px;font:inherit;font-size:13px}textarea{min-height:110px;resize:vertical}.row{margin-top:7px}
.choice{font-size:12px;color:#16803c;font-weight:700;margin-top:9px;min-height:17px}
.batch{position:sticky;bottom:8px;border:1px solid #ddd;border-radius:16px;padding:11px;background:rgba(255,255,255,.97);box-shadow:0 5px 22px rgba(0,0,0,.09);display:grid;gap:7px}
.execute{width:100%;border:0;border-radius:11px;padding:11px 14px;background:#171717;color:#fff;font-size:14px;font-weight:750;cursor:pointer}.execute:disabled{background:#d8d8d8;color:#888;cursor:not-allowed}
.empty{padding:24px;text-align:center;border:1px solid #e7e7e7;border-radius:14px;color:#666}
</style>
</head>
<body>
<main class="shell">
  <header class="head">
    <div><h1>Mejl – att göra</h1><div class="sub">Ta ställning till alla mejl. Inget skickas till ChatGPT förrän du klickar Utför.</div></div>
    <div class="counter" id="counter">0 av 0 hanterade</div>
  </header>
  <div id="list"></div>
  <section class="batch">
    <div class="help" id="help">Gå igenom alla uppgifter först.</div>
    <button class="execute" id="execute" disabled>Utför åtgärder</button>
    <div class="status" id="status"></div>
  </section>
</main>
<script type="module">
const listEl=document.querySelector('#list'),counterEl=document.querySelector('#counter'),helpEl=document.querySelector('#help'),executeEl=document.querySelector('#execute'),statusEl=document.querySelector('#status');
let tasks=[],rpcId=0,sent=false;const pending=new Map(),decisions=new Map();

function request(method,params){return new Promise((resolve,reject)=>{const id=++rpcId;pending.set(id,{resolve,reject});parent.postMessage({jsonrpc:'2.0',id,method,params},'*')})}
function notify(method,params){parent.postMessage({jsonrpc:'2.0',method,params},'*')}
window.addEventListener('message',e=>{
  if(e.source!==parent)return; const m=e.data; if(!m||m.jsonrpc!=='2.0')return;
  if(typeof m.id==='number'){const p=pending.get(m.id);if(!p)return;pending.delete(m.id);m.error?p.reject(m.error):p.resolve(m.result);return}
  let incoming=null;
  if(m.method==='ui/notifications/tool-result') incoming=m.params?.structuredContent?.tasks;
  if(m.method==='ui/notifications/tool-input') incoming=m.params?.arguments?.tasks||m.params?.tasks;
  if(Array.isArray(incoming)){tasks=incoming;decisions.clear();sent=false;statusEl.textContent='';render()}
},{passive:true});

const ready=request('ui/initialize',{appInfo:{name:'mejlcentral',version:'0.3.0'},appCapabilities:{},protocolVersion:'2026-01-26'})
  .then(()=>notify('ui/notifications/initialized',{})).catch(()=>{});

const esc=(s='')=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]));
const label=a=>({reply:'Svara',done:'Klar',wait:'Vänta',watch:'Bevaka',remind:'Påminn',skip:'Hoppa över'}[a]||a);

function choose(t,action,extra={}){decisions.set(t.id,{taskId:t.id,title:t.title,account:t.account||'',action,...extra});sent=false;statusEl.textContent='';render()}

function render(){
  const handled=tasks.filter(t=>{const d=decisions.get(t.id);return d&&!d.editing}).length,total=tasks.length;
  counterEl.textContent=`${handled} av ${total} hanterade`;
  const complete=total>0&&handled===total;
  executeEl.disabled=!complete||sent;
  executeEl.textContent=sent?'Skickat till ChatGPT':complete?`Utför ${total} beslut`:'Utför åtgärder';
  helpEl.textContent=complete?'Alla uppgifter är genomgångna. Klicka Utför för att skicka hela batchen.':`${Math.max(total-handled,0)} kvar att ta ställning till.`;
  listEl.innerHTML='';
  if(!total){listEl.innerHTML='<div class="empty">Inga öppna mejluppgifter.</div>';return}

  tasks.forEach((t,i)=>{
    const d=decisions.get(t.id),editing=d?.editing;
    const el=document.createElement('section'); el.className=`card ${d&&!editing?'decided':''}`;
    el.innerHTML=`
      <div class="title">${i+1}. ${esc(t.title)}</div>
      <div class="meta">${esc(t.account||'')}${t.received?' · '+esc(t.received):''}</div>
      <div class="summary">${esc(t.summary||'')}</div>
      <div class="actions">
        ${['reply','done','wait','watch','remind','skip'].map(a=>`<button type="button" class="btn ${d?.action===a&&!editing?'selected':''} ${a==='skip'?'skip':''}" data-action="${a}">${label(a)}</button>`).join('')}
      </div>
      <div class="editor ${editing==='reply'?'show':''}" data-editor="reply">
        <textarea>${esc(d?.text??t.replyDraft??'')}</textarea>
        <div class="row"><button type="button" class="btn save-reply">Godkänn svar</button><button type="button" class="btn cancel">Avbryt</button></div>
      </div>
      <div class="editor ${editing==='remind'?'show':''}" data-editor="remind">
        <input type="datetime-local" value="${esc(d?.when||'')}">
        <div class="row"><button type="button" class="btn save-reminder">Spara påminnelse</button><button type="button" class="btn cancel">Avbryt</button></div>
      </div>
      <div class="choice">${d&&!editing?`Valt: ${label(d.action)}${d.when?' · '+esc(d.when.replace('T',' ')):''}`:''}</div>`;
    listEl.appendChild(el);

    el.addEventListener('click',ev=>{
      const b=ev.target.closest('button'); if(!b)return;
      const action=b.dataset.action;
      if(action==='reply'){decisions.set(t.id,{...(d||{}),taskId:t.id,title:t.title,account:t.account||'',action:'reply',editing:'reply'});render();return}
      if(action==='remind'){decisions.set(t.id,{...(d||{}),taskId:t.id,title:t.title,account:t.account||'',action:'remind',editing:'remind'});render();return}
      if(b.classList.contains('cancel')){decisions.delete(t.id);render();return}
      if(b.classList.contains('save-reply')){const text=el.querySelector('[data-editor="reply"] textarea').value.trim();if(text)choose(t,'reply',{text});return}
      if(b.classList.contains('save-reminder')){const when=el.querySelector('[data-editor="remind"] input').value;if(when)choose(t,'remind',{when});return}
      if(['done','wait','watch','skip'].includes(action))choose(t,action);
    });
  });
}

executeEl.addEventListener('click',async()=>{
  const vals=[...decisions.values()].filter(x=>!x.editing);
  if(vals.length!==tasks.length)return;
  const payload={source:'Mejlcentralen',type:'batch',version:3,total:tasks.length,
    actions:vals.filter(x=>x.action!=='skip'),
    skipped:vals.filter(x=>x.action==='skip').map(x=>({taskId:x.taskId,title:x.title,account:x.account}))};
  const prompt=`MEJLCENTRAL_BATCH ${JSON.stringify(payload)}`;
  statusEl.textContent='Skickar hela batchen till ChatGPT…'; executeEl.disabled=true;
  await ready;
  try{
    await request('ui/message',{role:'user',content:[{type:'text',text:prompt}]});
    sent=true; statusEl.textContent='Hela batchen är skickad till ChatGPT.'; render();
  }catch(err){
    if(window.openai?.sendFollowUpMessage){
      await window.openai.sendFollowUpMessage({prompt}); sent=true; statusEl.textContent='Hela batchen är skickad till ChatGPT.'; render();
    }else{statusEl.textContent='Kunde inte skicka batchen. Försök igen.';executeEl.disabled=false}
  }
});
render();
</script>
</body></html>
