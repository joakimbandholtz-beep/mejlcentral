<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mejlcentralen</title>
<style>:root{font-family:Inter,system-ui,sans-serif;color:#171717}*{box-sizing:border-box}body{margin:0;padding:12px}.shell{max-width:760px;margin:auto;display:grid;gap:10px}.head{display:flex;justify-content:space-between;gap:12px}.sub,.meta,.batchline,.batchstatus{font-size:12px;color:#666}.count{font-size:12px;padding:5px 9px;border:1px solid #ddd;border-radius:999px;white-space:nowrap}.card{border:1px solid #e3e3e3;border-radius:16px;padding:14px}.card.decided{border-color:#b8dec4}.title{font-weight:700}.summary{font-size:13px;margin:11px 0}.actions,.row{display:flex;flex-wrap:wrap;gap:7px}.btn{border:1px solid #d7d7d7;border-radius:10px;padding:8px 11px;background:#fff;font-weight:650;cursor:pointer}.btn.selected{background:#16803c;color:#fff;border-color:#16803c}.skip{color:#666}.editor{display:none;margin-top:10px;padding-top:10px;border-top:1px solid #eee}.editor.show{display:block}.editor textarea,.editor input{width:100%;border:1px solid #ddd;border-radius:10px;padding:9px;margin-bottom:7px}.choice{font-size:12px;color:#16803c;font-weight:650;margin-top:8px}.batch{position:sticky;bottom:8px;background:#fff;border:1px solid #ddd;border-radius:16px;padding:11px;box-shadow:0 5px 22px #0001}.execute{width:100%;border:0;border-radius:11px;padding:11px;background:#171717;color:#fff;font-weight:750}.execute:disabled{background:#ddd;color:#888}</style></head>
<body><main class="shell"><div class="head"><div><h3 style="margin:0">Mejl – att göra</h3><div class="sub">Ta ställning till alla. Inget skickas förrän du klickar Utför.</div></div><div id="count" class="count">0 av 0 hanterade</div></div><div id="list"></div><div class="batch"><div id="batchline" class="batchline"></div><button id="execute" class="execute" disabled>Utför åtgärder</button><div id="batchstatus" class="batchstatus"></div></div></main>
<script type="module">
const list=document.querySelector('#list'),count=document.querySelector('#count'),execute=document.querySelector('#execute'),batchline=document.querySelector('#batchline'),batchstatus=document.querySelector('#batchstatus');let tasks=[],rpcId=0;const pending=new Map(),decisions=new Map();let bridgeReady;
const notify=(method,params)=>parent.postMessage({jsonrpc:'2.0',method,params},'*');const request=(method,params)=>new Promise((resolve,reject)=>{const id=++rpcId;pending.set(id,{resolve,reject});parent.postMessage({jsonrpc:'2.0',id,method,params},'*')});
addEventListener('message',e=>{if(e.source!==parent)return;const m=e.data;if(!m||m.jsonrpc!=='2.0')return;if(typeof m.id==='number'){const p=pending.get(m.id);if(!p)return;pending.delete(m.id);m.error?p.reject(m.error):p.resolve(m.result);return}const t=m.method==='ui/notifications/tool-result'?m.params?.structuredContent?.tasks:m.method==='ui/notifications/tool-input'?(m.params?.arguments?.tasks||m.params?.tasks):null;if(Array.isArray(t)){tasks=t;render()}});
bridgeReady=request('ui/initialize',{appInfo:{name:'mejlcentral',version:'0.3.0'},appCapabilities:{},protocolVersion:'2026-01-26'}).then(()=>notify('ui/notifications/initialized',{})).catch(()=>{});
const esc=(s='')=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]));const lab=a=>({reply:'Svara',done:'Klar',wait:'Vänta',watch:'Bevaka',remind:'Påminn',skip:'Hoppa över'}[a]||a);
function setD(t,action,extra={}){decisions.set(t.id,{taskId:t.id,title:t.title,account:t.account,action,...extra});render()}
function render(){const handled=tasks.filter(t=>decisions.has(t.id)&&!decisions.get(t.id).editing).length;count.textContent=`${handled} av ${tasks.length} hanterade`;execute.disabled=!(tasks.length&&handled===tasks.length);execute.textContent=execute.disabled?'Utför åtgärder':`Utför ${tasks.length} beslut`;batchline.textContent=execute.disabled?`${tasks.length-handled} kvar att ta ställning till.`:'Alla uppgifter är genomgångna.';list.innerHTML='';
tasks.forEach((t,i)=>{const d=decisions.get(t.id),el=document.createElement('section');el.className='card '+(d&&!d.editing?'decided':'');el.innerHTML=`<div class="title">${i+1}. ${esc(t.title)}</div><div class="meta">${esc(t.account||'')} ${t.received?'· '+esc(t.received):''}</div><div class="summary">${esc(t.summary||'')}</div><div class="actions">${['reply','done','wait','watch','remind','skip'].map(a=>`<button class="btn ${d?.action===a&&!d.editing?'selected':''} ${a==='skip'?'skip':''}" data-a="${a}">${lab(a)}</button>`).join('')}</div><div class="editor ${d?.editing==='reply'?'show':''}"><textarea>${esc(d?.text??t.replyDraft??'')}</textarea><div class="row"><button class="btn saveReply">Godkänn svar</button><button class="btn cancel">Avbryt</button></div></div><div class="editor ${d?.editing==='remind'?'show':''}"><input type="datetime-local" value="${esc(d?.when||'')}"><button class="btn saveReminder">Spara påminnelse</button></div><div class="choice">${d&&!d.editing?'Valt: '+lab(d.action)+(d.when?' · '+esc(d.when.replace('T',' ')):''):''}</div>`;list.appendChild(el);
el.onclick=e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.a;if(a==='reply'){decisions.set(t.id,{...(d||{}),taskId:t.id,title:t.title,account:t.account,action:'reply',editing:'reply'});render();return}if(a==='remind'){decisions.set(t.id,{...(d||{}),taskId:t.id,title:t.title,account:t.account,action:'remind',editing:'remind'});render();return}if(b.classList.contains('cancel')){decisions.delete(t.id);render();return}if(b.classList.contains('saveReply')){const text=el.querySelector('textarea').value.trim();if(text)setD(t,'reply',{text});return}if(b.classList.contains('saveReminder')){const when=el.querySelector('input').value;if(when)setD(t,'remind',{when});return}if(['done','wait','watch','skip'].includes(a))setD(t,a)};});}
execute.onclick=async()=>{const vals=[...decisions.values()],payload={source:'Mejlcentralen',type:'batch',total:tasks.length,actions:vals.filter(x=>x.action!=='skip'),skipped:vals.filter(x=>x.action==='skip').map(x=>({taskId:x.taskId,title:x.title,account:x.account}))},prompt=`MEJLCENTRAL_BATCH ${JSON.stringify(payload)}`;batchstatus.textContent='Skickar hela batchen till ChatGPT…';execute.disabled=true;await bridgeReady;try{await request('ui/message',{role:'user',content:[{type:'text',text:prompt}]});batchstatus.textContent='Batchen är skickad till ChatGPT.'}catch{if(window.openai?.sendFollowUpMessage){await window.openai.sendFollowUpMessage({prompt});batchstatus.textContent='Batchen är skickad till ChatGPT.'}else{batchstatus.textContent='Kunde inte skicka. Försök igen.';execute.disabled=false}}};render();
</script></body></html>
