<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Mejlcentralen v5</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #ffffff;
      --surface: #f7f7f8;
      --border: #dedee3;
      --text: #171717;
      --muted: #6b6b73;

      --green: #16803c;
      --green-bg: #e8f5ec;

      --yellow: #f4c542;
      --yellow-border: #c99f00;
      --yellow-bg: #fff7d1;

      --blue: #2563eb;
    }

    body {
      margin: 0;
      padding: 16px;

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: var(--bg);
      color: var(--text);
    }

    .app {
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 16px;
    }

    .header h1 {
      margin: 0 0 5px;
      font-size: 22px;
      line-height: 1.2;
    }

    .header p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .progress {
      margin-top: 10px;
      font-size: 13px;
      color: var(--muted);
    }

    .tasks {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      background: var(--surface);

      transition:
        background 0.15s ease,
        border-color 0.15s ease;
    }

    .card.decided {
      border-color: #b8d9c2;
      background: #f5fbf7;
    }

    .card.noaction {
      border-color: var(--yellow-border);
      background: var(--yellow-bg);
    }

    .title {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 5px;
    }

    .meta {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 9px;
    }

    .summary {
      font-size: 14px;
      line-height: 1.45;
      margin-bottom: 12px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    button {
      font: inherit;
    }

    .btn {
      appearance: none;
      border: 1px solid #cfcfd5;
      background: #fff;
      color: var(--text);

      border-radius: 9px;
      padding: 8px 11px;

      font-size: 13px;
      font-weight: 600;

      cursor: pointer;

      transition:
        background 0.12s ease,
        border-color 0.12s ease,
        color 0.12s ease,
        transform 0.05s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    /*
     * Vanliga val.
     * Dessa får bli gröna.
     */
    .btn.selected {
      background: var(--green-bg);
      border-color: var(--green);
      color: #0b5c29;
    }

    /*
     * Ingen åtgärd har en egen klass.
     * Den använder ALDRIG .selected.
     */
    .btn.skip {
      background: #fffdf3;
      border-color: #dbc86e;
      color: #665500;
    }

    .btn.skip-selected {
      background: var(--yellow) !important;
      border-color: var(--yellow-border) !important;
      color: #171717 !important;
    }

    .reply-box {
      display: none;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .reply-box.visible {
      display: block;
    }

    .reply-label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    textarea {
      width: 100%;
      min-height: 130px;

      resize: vertical;

      border: 1px solid #cfcfd5;
      border-radius: 10px;

      padding: 10px;

      font: inherit;
      font-size: 14px;
      line-height: 1.45;

      background: #fff;
      color: var(--text);
    }

    textarea:focus {
      outline: 2px solid rgba(37, 99, 235, 0.18);
      border-color: var(--blue);
    }

    .approve {
      margin-top: 8px;

      border: 0;
      border-radius: 9px;

      background: var(--blue);
      color: #fff;

      padding: 8px 12px;

      font-size: 13px;
      font-weight: 700;

      cursor: pointer;
    }

    .approve.approved {
      background: var(--green);
    }

    .reply-state {
      margin-left: 8px;
      font-size: 12px;
      color: var(--muted);
    }

    .choice {
      display: none;

      margin-top: 10px;
      padding: 7px 9px;

      border-radius: 8px;

      background: #eaf6ed;
      color: #155d2c;

      font-size: 12px;
      font-weight: 650;
    }

    .choice.visible {
      display: inline-block;
    }

    .choice.noaction-choice {
      background: #f4c542;
      color: #171717;
    }

    .footer {
      position: sticky;
      bottom: 0;

      margin-top: 16px;
      padding: 12px 0 4px;

      background:
        linear-gradient(
          to bottom,
          rgba(255,255,255,0),
          rgba(255,255,255,0.96) 28%,
          #fff 55%
        );
    }

    .execute {
      width: 100%;

      border: 0;
      border-radius: 11px;

      padding: 12px 16px;

      background: #171717;
      color: #fff;

      font-size: 14px;
      font-weight: 750;

      cursor: pointer;
    }

    .execute:disabled {
      cursor: not-allowed;
      opacity: 0.35;
    }

    .hint {
      margin-top: 7px;
      text-align: center;
      font-size: 11px;
      color: var(--muted);
    }

    .empty {
      padding: 24px;
      border: 1px dashed var(--border);
      border-radius: 12px;
      text-align: center;
      color: var(--muted);
    }

    .sent {
      padding: 18px;

      border: 1px solid #b8d9c2;
      border-radius: 12px;

      background: #f1faf4;

      text-align: center;
    }

    .sent strong {
      display: block;
      margin-bottom: 4px;
    }
  </style>
</head>

<body>
  <main class="app">

    <header class="header">
      <h1>Mejlcentralen</h1>

      <p>
        Välj vad som ska göras med varje mejl.
        Ingenting skickas till ChatGPT förrän du klickar
        <strong>Utför åtgärder</strong>.
      </p>

      <div
        id="progress"
        class="progress"
      ></div>
    </header>

    <section
      id="tasks"
      class="tasks"
    ></section>

    <footer
      id="footer"
      class="footer"
    >
      <button
        id="execute"
        class="execute"
        type="button"
        disabled
      >
        Utför åtgärder
      </button>

      <div class="hint">
        Alla mejl måste ha ett val innan batchen kan utföras.
      </div>
    </footer>

  </main>

  <script>
    const APP_VERSION = "0.5.0";

    const STATUS_CONFIG = {
      reply: {
        label: "Svara"
      },

      done: {
        label: "Klar"
      },

      wait: {
        label: "Vänta"
      },

      watch: {
        label: "Bevaka"
      },

      remind: {
        label: "Påminn"
      },

      skip: {
        label: "Ingen åtgärd"
      }
    };

    /*
     * Ingen åtgärd läggs alltid sist.
     */
    const STATUS_ORDER = [
      "reply",
      "done",
      "wait",
      "watch",
      "remind",
      "skip"
    ];

    let tasks = [];

    /*
     * decisions:
     *
     * {
     *   taskId: {
     *     status: "...",
     *     text: "...",
     *     approved: true/false
     *   }
     * }
     */
    const decisions = {};

    const tasksElement =
      document.getElementById("tasks");

    const executeElement =
      document.getElementById("execute");

    const progressElement =
      document.getElementById("progress");

    const footerElement =
      document.getElementById("footer");


    function normalizeStatuses(task) {
      const incoming =
        Array.isArray(task.statuses)
          ? task.statuses
          : [];

      /*
       * Ta endast med giltiga statusar.
       */
      const valid =
        incoming.filter(
          status =>
            Object.prototype.hasOwnProperty.call(
              STATUS_CONFIG,
              status
            )
        );

      /*
       * skip ska ALLTID finnas.
       */
      if (!valid.includes("skip")) {
        valid.push("skip");
      }

      /*
       * Ta bort dubletter och sortera.
       */
      return STATUS_ORDER.filter(
        status =>
          valid.includes(status)
      );
    }


    function normalizeTasks(input) {
      if (!Array.isArray(input)) {
        return [];
      }

      return input.map(task => ({
        id:
          String(
            task.id ?? ""
          ),

        title:
          String(
            task.title ??
            "Mejl"
          ),

        account:
          String(
            task.account ?? ""
          ),

        received:
          String(
            task.received ?? ""
          ),

        summary:
          String(
            task.summary ?? ""
          ),

        statuses:
          normalizeStatuses(task),

        replyDraft:
          typeof task.replyDraft === "string"
            ? task.replyDraft
            : "",

        done:
          Boolean(task.done)
      }));
    }


    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    function getDecision(taskId) {
      return decisions[taskId] || null;
    }


    function setDecision(
      taskId,
      status
    ) {
      const task =
        tasks.find(
          item =>
            item.id === taskId
        );

      if (!task) {
        return;
      }

      /*
       * Svara kräver separat godkännande.
       */
      if (status === "reply") {
        decisions[taskId] = {
          status: "reply",
          text:
            task.replyDraft || "",
          approved: false
        };
      } else {
        decisions[taskId] = {
          status
        };
      }

      render();
    }


    function approveReply(
      taskId,
      text
    ) {
      decisions[taskId] = {
        status: "reply",
        text,
        approved: true
      };

      render();
    }


    function decisionComplete(
      task
    ) {
      const decision =
        getDecision(task.id);

      if (!decision) {
        return false;
      }

      if (
        decision.status === "reply"
      ) {
        return (
          decision.approved === true &&
          typeof decision.text === "string" &&
          decision.text.trim().length > 0
        );
      }

      return true;
    }


    function allComplete() {
      return (
        tasks.length > 0 &&
        tasks.every(
          decisionComplete
        )
      );
    }


    function renderProgress() {
      if (!tasks.length) {
        progressElement.textContent = "";
        return;
      }

      const complete =
        tasks.filter(
          decisionComplete
        ).length;

      progressElement.textContent =
        `${complete} av ${tasks.length} klara`;
    }


    function createButton(
      task,
      status,
      decision
    ) {
      const config =
        STATUS_CONFIG[status];

      const button =
        document.createElement("button");

      button.type = "button";
      button.className = "btn";
      button.textContent =
        config.label;

      /*
       * KRITISKT:
       *
       * skip använder ALDRIG
       * klassen "selected".
       *
       * Därför kan den inte få
       * den gröna selected-stilen.
       */
      if (status === "skip") {
        button.classList.add("skip");

        if (
          decision?.status === "skip"
        ) {
          button.classList.add(
            "skip-selected"
          );
        }
      } else if (
        decision?.status === status
      ) {
        button.classList.add(
          "selected"
        );
      }

      button.addEventListener(
        "click",
        () => {
          setDecision(
            task.id,
            status
          );
        }
      );

      return button;
    }


    function createReplyBox(
      task,
      decision
    ) {
      const box =
        document.createElement("div");

      box.className =
        "reply-box visible";

      const label =
        document.createElement("label");

      label.className =
        "reply-label";

      label.textContent =
        "Svar:";

      const textarea =
        document.createElement("textarea");

      textarea.value =
        decision?.text ??
        task.replyDraft ??
        "";

      const approve =
        document.createElement("button");

      approve.type = "button";
      approve.className = "approve";

      const state =
        document.createElement("span");

      state.className =
        "reply-state";

      if (
        decision?.approved === true
      ) {
        approve.classList.add(
          "approved"
        );

        approve.textContent =
          "Svar godkänt";

        state.textContent =
          "Klart för att skickas när batchen utförs.";
      } else {
        approve.textContent =
          "Godkänn svar";

        state.textContent =
          "Du kan redigera texten först.";
      }

      approve.addEventListener(
        "click",
        () => {
          const text =
            textarea.value.trim();

          if (!text) {
            state.textContent =
              "Svaret får inte vara tomt.";
            return;
          }

          approveReply(
            task.id,
            text
          );
        }
      );

      /*
       * Om användaren ändrar ett redan
       * godkänt svar måste det godkännas igen.
       */
      textarea.addEventListener(
        "input",
        () => {
          const current =
            decisions[task.id];

          if (
            current &&
            current.status === "reply"
          ) {
            current.text =
              textarea.value;

            current.approved =
              false;

            approve.classList.remove(
              "approved"
            );

            approve.textContent =
              "Godkänn svar";

            state.textContent =
              "Texten ändrades – godkänn svaret igen.";

            updateExecuteState();
            renderProgress();
          }
        }
      );

      box.appendChild(label);
      box.appendChild(textarea);
      box.appendChild(approve);
      box.appendChild(state);

      return box;
    }


    function createChoice(
      decision
    ) {
      const choice =
        document.createElement("div");

      choice.className =
        "choice visible";

      const label =
        STATUS_CONFIG[
          decision.status
        ]?.label ??
        decision.status;

      choice.textContent =
        `Valt: ${label}`;

      if (
        decision.status === "skip"
      ) {
        choice.classList.add(
          "noaction-choice"
        );
      }

      return choice;
    }


    function createCard(task) {
      const decision =
        getDecision(task.id);

      const card =
        document.createElement("article");

      card.className = "card";

      if (decision) {
        if (
          decision.status === "skip"
        ) {
          card.classList.add(
            "noaction"
          );
        } else {
          card.classList.add(
            "decided"
          );
        }
      }

      const title =
        document.createElement("div");

      title.className = "title";
      title.textContent =
        task.title;

      const meta =
        document.createElement("div");

      meta.className = "meta";

      const metaParts = [];

      if (task.account) {
        metaParts.push(
          task.account
        );
      }

      if (task.received) {
        metaParts.push(
          task.received
        );
      }

      meta.textContent =
        metaParts.join(" · ");

      const summary =
        document.createElement("div");

      summary.className =
        "summary";

      summary.textContent =
        task.summary;

      const buttons =
        document.createElement("div");

      buttons.className =
        "buttons";

      /*
       * Nu renderas INTE alla knappar.
       *
       * Endast de statusar som faktiskt
       * skickats för mejlet visas,
       * plus skip som alltid finns.
       */
      task.statuses.forEach(
        status => {
          buttons.appendChild(
            createButton(
              task,
              status,
              decision
            )
          );
        }
      );

      card.appendChild(title);

      if (
        task.account ||
        task.received
      ) {
        card.appendChild(meta);
      }

      if (task.summary) {
        card.appendChild(summary);
      }

      card.appendChild(buttons);

      if (
        decision?.status === "reply"
      ) {
        card.appendChild(
          createReplyBox(
            task,
            decision
          )
        );
      }

      if (
        decision &&
        decision.status !== "reply"
      ) {
        card.appendChild(
          createChoice(
            decision
          )
        );
      }

      return card;
    }


    function updateExecuteState() {
      executeElement.disabled =
        !allComplete();
    }


    function render() {
      tasksElement.innerHTML = "";

      if (!tasks.length) {
        tasksElement.innerHTML =
          `
            <div class="empty">
              Inga mejluppgifter att visa.
            </div>
          `;

        executeElement.disabled =
          true;

        renderProgress();
        return;
      }

      tasks.forEach(
        task => {
          tasksElement.appendChild(
            createCard(task)
          );
        }
      );

      renderProgress();
      updateExecuteState();
    }


    function buildBatchPayload() {
      const actions = [];
      const skipped = [];

      tasks.forEach(
        task => {
          const decision =
            decisions[task.id];

          if (!decision) {
            return;
          }

          if (
            decision.status === "skip"
          ) {
            skipped.push({
              id: task.id,
              title: task.title,
              account: task.account
            });

            return;
          }

          const action = {
            id: task.id,
            title: task.title,
            account: task.account,
            status: decision.status
          };

          if (
            decision.status === "reply"
          ) {
            action.text =
              decision.text;

            action.approved =
              decision.approved === true;
          }

          actions.push(action);
        }
      );

      return {
        source: "Mejlcentralen",
        type: "batch",
        version: 5,
        appVersion: APP_VERSION,
        actions,
        skipped
      };
    }


    async function sendBatch() {
      if (!allComplete()) {
        return;
      }

      const payload =
        buildBatchPayload();

      const message =
        `MEJLCENTRAL_BATCH ${JSON.stringify(payload)}`;

      executeElement.disabled =
        true;

      executeElement.textContent =
        "Skickar…";

      try {

        /*
         * Primär väg i ChatGPT Apps.
         */
        if (
          window.openai &&
          typeof window.openai.sendFollowUpMessage === "function"
        ) {
          await window.openai.sendFollowUpMessage({
            prompt: message
          });
        }

        /*
         * Fallback för värdmiljöer
         * som använder postMessage/ui-message.
         */
        else if (
          window.parent &&
          window.parent !== window
        ) {
          window.parent.postMessage(
            {
              type: "ui/message",
              message
            },
            "*"
          );
        }

        else {
          throw new Error(
            "Ingen tillgänglig kanal till ChatGPT."
          );
        }

        tasksElement.innerHTML =
          `
            <div class="sent">
              <strong>
                Åtgärderna har skickats till ChatGPT.
              </strong>

              ChatGPT utför nu de val du godkänt.
            </div>
          `;

        footerElement.style.display =
          "none";

        progressElement.textContent =
          "";

      } catch (error) {
        console.error(error);

        executeElement.disabled =
          false;

        executeElement.textContent =
          "Utför åtgärder";

        alert(
          "Det gick inte att skicka åtgärderna till ChatGPT. Försök igen."
        );
      }
    }


    executeElement.addEventListener(
      "click",
      sendBatch
    );


    /*
     * Läs data från ChatGPT Apps SDK.
     */
    function readToolOutput() {
      const output =
        window.openai?.toolOutput;

      if (!output) {
        return null;
      }

      /*
       * Normalt v5-format.
       */
      if (
        Array.isArray(
          output.tasks
        )
      ) {
        return output.tasks;
      }

      /*
       * Fallback om structuredContent
       * exponeras explicit.
       */
      if (
        output.structuredContent &&
        Array.isArray(
          output.structuredContent.tasks
        )
      ) {
        return output
          .structuredContent
          .tasks;
      }

      return null;
    }


    function initialize() {
      const initial =
        readToolOutput();

      if (initial) {
        tasks =
          normalizeTasks(initial);

        render();
      }
    }


    /*
     * Första laddningen.
     */
    initialize();


    /*
     * ChatGPT kan uppdatera toolOutput
     * efter att widgeten laddats.
     */
    window.addEventListener(
      "openai:set_globals",
      event => {
        const globals =
          event?.detail?.globals;

        if (!globals) {
          return;
        }

        const output =
          globals.toolOutput;

        if (!output) {
          return;
        }

        let incoming = null;

        if (
          Array.isArray(
            output.tasks
          )
        ) {
          incoming =
            output.tasks;
        }

        else if (
          output.structuredContent &&
          Array.isArray(
            output.structuredContent.tasks
          )
        ) {
          incoming =
            output
              .structuredContent
              .tasks;
        }

        if (incoming) {
          tasks =
            normalizeTasks(incoming);

          render();
        }
      }
    );


    /*
     * Fallback för lokal testning.
     *
     * Körs bara om ingen toolOutput
     * kommit från ChatGPT.
     */
    setTimeout(
      () => {
        if (
          tasks.length === 0 &&
          !window.openai?.toolOutput
        ) {
          tasks = [];

          render();
        }
      },
      400
    );
  </script>

</body>
</html>
